name: Pruebas de la app

# Abre cada página de la app de Streamlit con la muestra del modelo y falla si alguna da error,
# para enterarse en GitHub antes de que el fallo llegue a la app publicada.
on:
  push:
    paths:
      - "streamlit_app/**"
      - "resultados/dev_modelo/**"
      - ".github/workflows/app_pruebas.yml"
  pull_request:
    paths:
      - "streamlit_app/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paginas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: streamlit_app/requirements.txt
      - name: Dependencias
        run: pip install -r streamlit_app/requirements.txt pytest
      - name: Probar todas las páginas
        working-directory: streamlit_app
        run: python -m pytest tests -q
