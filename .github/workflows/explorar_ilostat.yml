name: Exploración ILOSTAT

# Comprueba qué devuelve ILOSTAT (formato, códigos, cobertura) y guarda el resultado como artefacto.
on:
  workflow_dispatch:
  push:
    paths:
      - "exploracion/**"

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Explorar
        run: python exploracion/explorar_ilostat.py
      - name: Resultados
        if: always()
        run: |
          cat resultados/exploracion/descargas.csv || true
          head -c 3000 resultados/exploracion/toc_csv.txt || true
          echo; grep -E "^(POP|EAP|UNE)_" resultados/exploracion/toc_csv.txt | grep -E "SEX_AGE_(NB|RT)_A" | head -60 || true
          awk -F';' '$3=="ESP" || $3=="PRT"' resultados/exploracion/cobertura.csv | grep -E "SEX_T" | head -80 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exploracion-ilostat
          path: resultados/exploracion/
